<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"></head><body>
<title>Nitro Circuit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=Cairo:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed canvas game, DOM menus laid over it, thumb controls pinned to the bottom corners.
   Look: night circuit, amber for action, cyan reserved for turbo. */
:root{
  --bg:#080c1a; --panel:#111833; --panel2:#18214a; --line:#2a3768;
  --fg:#eef2ff; --mute:#9aa6d4; --amber:#ffb300; --amber-ink:#2a1c00;
  --cyan:#19d3ff; --good:#43e08a; --bad:#ff5470;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;margin:0;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;background:#0d47a1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow-y:auto;
  padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(8,12,26,.88),rgba(8,12,26,.72) 55%,rgba(8,12,26,.9));touch-action:pan-y}
.screen.clear{background:rgba(8,12,26,.55)}
.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;margin:auto 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.02em;text-wrap:balance}
.logo{font-size:clamp(40px,11vw,68px);font-weight:700;line-height:.95;text-transform:uppercase;letter-spacing:.03em}
.logo span{display:block;color:var(--amber)}
.tag{color:var(--mute);margin:6px 0 0;font-size:14px}
h2{font-size:26px;text-transform:uppercase}
h3{font-size:15px;color:var(--mute);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.coins{font-family:var(--display);font-weight:700;font-size:20px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;display:inline-flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.coins i{width:14px;height:14px;border-radius:50%;background:var(--amber);box-shadow:inset 0 0 0 3px #ffd75e;display:inline-block}
.btn{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;border:0;border-radius:14px;
  min-height:52px;padding:0 20px;font-size:18px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.btn:active{transform:translateY(1px);filter:brightness(1.15)}
.btn.primary{background:var(--amber);color:var(--amber-ink);box-shadow:none;min-height:64px;font-size:24px}
.btn.small{min-height:40px;font-size:14px;padding:0 14px;border-radius:10px}
.btn[disabled]{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.row>div{min-width:0}
.muted{color:var(--mute);font-size:13px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;min-height:38px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--mute);padding:0 10px}
.seg button.on{background:var(--amber);color:var(--amber-ink)}
.tabs{display:flex;gap:8px}
.tabs button{flex:1}
.pips{display:flex;gap:4px}
.pips b{width:100%;height:8px;border-radius:2px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);display:block}
.pips b.on{background:var(--amber);box-shadow:none}
.upg{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.upg .pips{grid-column:1/-1}
.upg h3{color:var(--fg);font-size:17px;letter-spacing:.04em}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.sw{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.sw.sel{border-color:var(--amber)}
.sw canvas{width:84px;height:62px}
.sw .nm{font-family:var(--display);font-weight:600}
.stat{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.res td{padding:5px 6px;border-bottom:1px solid var(--line)}
table.res tr.me td{color:var(--amber);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px}
.earn{font-family:var(--display);font-size:30px;color:var(--amber);font-weight:700}
.hint{text-align:center;color:var(--mute);font-size:13px}
.flash{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-family:var(--display);font-weight:600;z-index:30}

/* ---- thumb controls ---- */
#touch{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:10px max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px))}
#touch .grp{display:flex;gap:12px;pointer-events:none}
#touch button{pointer-events:auto;touch-action:none;border:2px solid rgba(255,255,255,.35);background:rgba(10,16,40,.5);
  color:#fff;border-radius:22px;font-family:var(--display);font-weight:700;font-size:22px;width:var(--cb,84px);height:var(--cb,84px);backdrop-filter:blur(2px)}
#touch button.on{background:rgba(255,179,0,.75);color:#2a1c00;border-color:#fff}
#touch button.turbo{border-color:var(--cyan);color:var(--cyan);font-size:15px}
#touch button.turbo.on{background:rgba(25,211,255,.8);color:#021a22}
#touch button.wide{width:calc(var(--cb,84px)*1.15);font-size:15px}
#pauseBtn{position:absolute;z-index:5;top:4px;right:max(8px,env(safe-area-inset-right,0px));
  background:rgba(10,16,40,.6);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:0 14px;height:30px;font-family:var(--display);font-weight:700;letter-spacing:.08em;font-size:13px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (orientation:landscape) and (max-height:520px){
  .wrap.home{max-width:880px;display:grid;grid-template-columns:1fr 1fr;gap:14px 28px;align-items:center}
}
@media (max-height:430px){.screen{padding-block:10px}.wrap{gap:10px}.btn.primary{min-height:52px}.logo{font-size:40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- podium ---- */
.podium{width:100%;max-width:520px;height:auto;aspect-ratio:640/300;align-self:center}
details.card summary{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);cursor:pointer}
/* ---- splash, toasts, new cards ---- */
#splash{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(120% 90% at 50% 20%,#17214a,#080c1a 70%);transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
.sp-logo{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(34px,9vw,60px);letter-spacing:.06em;line-height:1;text-align:center}
.sp-logo span{color:var(--amber)}
.sp-by{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-size:clamp(13px,3.4vw,18px);margin-top:10px;text-align:center}
.sp-by b{color:var(--fg)}
.sp-load{width:min(320px,72vw);display:flex;flex-direction:column;gap:8px;align-items:center}
.sp-track{width:100%;height:10px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
#splashBar{height:100%;width:0;background:linear-gradient(90deg,var(--amber),#ffd75e);border-radius:999px}
#splashPct{font-family:var(--display);font-size:13px;color:var(--mute);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.flash.gold{background:var(--amber);color:var(--amber-ink);border-color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid3 .btn{font-size:14px;padding:0 6px;min-height:48px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:0;border-radius:999px;min-height:38px;padding:0 14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--display);font-weight:600;font-size:14px;color:var(--mute)}
.chips button.on{background:var(--amber);color:var(--amber-ink);box-shadow:none}
.chips button.lock{opacity:.7}.chips button span{font-size:12px;opacity:.8}
.card.selc{border-color:var(--amber)}
.carc{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.carc canvas{width:96px;height:72px}
.carx{display:flex;flex-direction:column;gap:5px;min-width:0}
.barrow{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}
.tprev{width:100%;height:auto;aspect-ratio:8/3;border-radius:10px;display:block}
.aw{font-family:var(--display);font-weight:700;color:var(--amber);white-space:nowrap}.aw.done{color:var(--good)}

/* ---- language, code box ---- */
body.ar{--display:"Cairo","Chakra Petch",system-ui,sans-serif;--body:"Cairo","Inter",system-ui,sans-serif}
body.ar .logo,body.ar .sp-logo{letter-spacing:0}
body.ar h2,body.ar h3,body.ar .sp-by{letter-spacing:0;text-transform:none}
.langs{display:flex;gap:8px}.langs button{flex:1;border:0;border-radius:999px;min-height:38px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--body);font-weight:600;font-size:14px;color:var(--mute)}
.langs button.on{background:var(--amber);color:var(--amber-ink);box-shadow:none}
input{user-select:text;-webkit-user-select:text;touch-action:auto}
.codebox{display:flex;gap:10px}.codebox input{flex:1;min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px;padding:0 12px}
.tabs.wrapx{flex-wrap:wrap}.tabs.wrapx button{flex:1 1 30%}
</style>
<div id="app">
  <canvas id="cv"></canvas>
  <button id="pauseBtn" hidden>PAUSE</button>
  <div id="touch" hidden>
    <div class="grp"><button id="bL" aria-label="Steer left">&#9664;</button><button id="bR" aria-label="Steer right">&#9654;</button></div>
    <div class="grp"><button id="bBrake" class="wide">BRAKE</button><button id="bTurbo" class="turbo wide">TURBO</button><button id="bGas" class="wide" hidden>GAS</button></div>
  </div>
  <div id="screen" class="screen"></div>
  <div id="splash"><div><div class="sp-logo">Nitro <span>Circuit</span></div><div class="sp-by" id="spBy">Created by <b>Yahya</b></div></div>
    <div class="sp-load"><div class="sp-track"><div id="splashBar"></div></div><div id="splashPct">0%</div></div></div>
</div>

const PAINTS = [

  // standings (left)

    tx((i + 1) + ' ' + dn(r), sx + 17 * S, y, 10.5 * S, r.me ? '#ffeb3b' : '#fff');
  });

  // minimap (right)

  ctx.closePath(); ctx.strokeStyle = '#555'; ctx.lineWidth = 6 * S; ctx.stroke(); ctx.strokeStyle = '#d0d0d0'; ctx.lineWidth = 2.5 * S; ctx.stroke();

/* F1 car seen from behind: wide rear wing, two big rear tyres, halo and shark-fin cover */

  const P = (f, ...p) => { c.fillStyle = f; c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); c.closePath(); c.fill(); };

  }

  R(cx - 0.27 * w, by - 0.14 * w, cx + 0.27 * w, by - 0.11 * w, '#111');                  // diffuser
  P(color, cx - 0.13 * w, by - 0.34 * w, cx - 0.07 * w, by - 0.6 * w, cx + 0.07 * w, by - 0.6 * w, cx + 0.13 * w, by - 0.34 * w); // engine cover
  R(cx - 0.012 * w, by - 0.6 * w, cx + 0.012 * w, by - 0.34 * w, ac);
  c.fillStyle = ac; c.beginPath(); c.arc(cx, by - 0.585 * w, 0.045 * w, 0, 6.2832); c.fill();   // helmet
  R(cx - 0.07 * w, by - 0.64 * w, cx + 0.07 * w, by - 0.625 * w, '#1a1a1a'); R(cx - 0.012 * w, by - 0.66 * w, cx + 0.012 * w, by - 0.6 * w, '#1a1a1a'); // halo

}

  } else if (T.weather === 'dust') {

function drawParticles() {
  const dt = frameDt, px = fxPX, py = fxPY, pw = fxPW;
  if (fx.crash) {
    for (let i = 0; i < 22; i++) emit(px + rnd(-0.3, 0.3) * pw, py - 0.3 * pw, rnd(-240, 240) * S, rnd(-320, -60) * S, rnd(0.35, 0.7), SPARK[i % 3], rnd(2, 3.5) * S, 700 * S);

  }
  if (state === 'play' && Math.abs(playerX) > 1 && speed > OFFROAD_LIMIT) {
    for (let i = 0; i < 2; i++) emit(px + (i ? 1 : -1) * 0.45 * pw, py - 0.05 * pw, rnd(-70, 70) * S + (i ? 40 : -40) * S, rnd(-110, -30) * S, rnd(0.35, 0.7), T.dust || T.g2, rnd(3, 7) * S, 120 * S);
  }

    g.fillStyle = th.rum1; g.beginPath(); g.moveTo(w / 2 - 14, hz); g.lineTo(w / 2 + 14, hz); g.lineTo(w / 2 + 140, h); g.lineTo(w / 2 - 140, h); g.fill();
    g.fillStyle = th.road1; g.beginPath(); g.moveTo(w / 2 - 11, hz); g.lineTo(w / 2 + 11, hz); g.lineTo(w / 2 + 120, h); g.lineTo(w / 2 - 120, h); g.fill();
    g.fillStyle = th.lane; for (let i = 0; i < 4; i++) { const y = hz + 8 + i * i * 4 + i * 12; g.fillRect(w / 2 - 1 - i, y, 2 + i * 2, 5 + i * 3); }
    if (th.zones.some(z => z.tunnel)) { g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, 0, 0, 0); }
  });
}


/* ================= actions ================= */
function flash(msg, gold) {
  const host = document.getElementById('app');
  const d = document.createElement('div'); d.className = 'flash' + (gold ? ' gold' : ''); d.textContent = msg;
  const n = host.querySelectorAll('.flash').length; d.style.top = (14 + n * 9) + '%';
  host.appendChild(d); setTimeout(() => d.remove(), gold ? 2600 : 1600);
}
let backTo = 'home';
function applyCar() { if (player) { player.color = paintColor(); player.kind = curCar().kind; player.accent = curCar().accent; } }
function changeTrack(id) {
  save.set.track = id; persist();
  if (state === 'menu') { loadTrack(id); position = 0; playerX = 0; makeRacers(false); player.prog = 0; }
}
function act(a) {
  const [name, p1, p2] = a.split('|');
  if (name === 'play') { startRace(); }
  else if (name === 'resume') togglePause();
  else if (name === 'restart') startRace();
  else if (name === 'menu') enterMenu();
  else if (name === 'go') { backTo = state === 'paused' ? 'pause' : state === 'finished' ? 'result' : 'home'; showScreen(p1); }
  else if (name === 'back') { showScreen(backTo); }
  else if (name === 'tab') { shopTab = p1; showScreen('shop'); }
  else if (name === 'track') {
    if (save.tracks.includes(p1)) { changeTrack(p1); showScreen('home'); }
    else { shopTab = 'trk'; backTo = 'home'; showScreen('shop'); flash(tr('{0} is locked', tr(THEMES[p1].name))); }
  }
  else if (name === 'trk') {
    const t = THEMES[p1];
    if (!save.tracks.includes(p1)) { if (save.coins < price(t.cost)) return; save.coins -= price(t.cost); save.tracks.push(p1); flash(tr('{0} unlocked', tr(t.name)), true); chime(); checkAch(); }
    changeTrack(p1); persist(); showScreen('shop');
  }
  else if (name === 'car') {
    const c = CARS.find(x => x.id === p1);
    if (!save.cars.includes(p1)) { if (save.coins < price(c.cost)) return; save.coins -= price(c.cost); save.cars.push(p1); flash(tr('{0} bought', tr(c.name)), true); chime(); }
    save.car = p1; persist(); applyCar(); checkAch(); showScreen('shop');
  }
  else if (name === 'set') {
    const cur = save.set[p1]; let v = p2;
    if (v === 'true') v = true; else if (v === 'false') v = false; else v = Number.isNaN(+v) ? v : +v;
    if (cur === v) return;
    save.set[p1] = v; persist();
    if (p1 === 'quality' || p1 === 'ctrl') resize();
    if ((p1 === 'sfx' || p1 === 'music') && v) audioInit();
    if (p1 === 'level') { D = DIFFICULTY[v]; }
    if (p1 === 'lang') applyLang();
    if (p1 === 'autoGas') { document.getElementById('bGas').hidden = v; resize(); }
    showScreen(curScreen);
  }
  else if (name === 'up') {
    const l = up(p1), cost = price(UP_COST[l]);
    if (l < UP_MAX && save.coins >= cost) { save.coins -= cost; save.up[p1] = l + 1; persist(); beep(660, 0.12); flash(tr('{0} level {1}', tr(UPGRADES.find(u => u.id === p1).name), l + 1)); checkAch(); showScreen('shop'); }
  }
  else if (name === 'paint') {
    const p = PAINTS.find(x => x.id === p1);
    if (!save.owned.includes(p1)) { if (save.coins < price(p.cost)) return; save.coins -= price(p.cost); save.owned.push(p1); flash(tr('{0} unlocked', tr(p.name))); }
    save.paint = p1; persist(); applyCar(); showScreen('shop');
  }
  else if (name === 'code') {
    const v = ((document.getElementById('codeIn') || {}).value || '').trim().toLowerCase();
    if (v === 'yahyaa') {
      save.free = true; TRACK_IDS.forEach(id => { if (!save.tracks.includes(id)) save.tracks.push(id); });
      CARS.forEach(c => { if (!save.cars.includes(c.id)) save.cars.push(c.id); });
      PAINTS.forEach(p => { if (!save.owned.includes(p.id)) save.owned.push(p.id); });
      UPGRADES.forEach(u => { save.up[u.id] = UP_MAX; });
      persist(); chime(); checkAch(); showScreen('shop'); flash(tr('Code accepted: everything is free'), true);
    } else flash(tr('Wrong code'));
  }
  else if (name === 'fs') {
    const el = document.documentElement;
    (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).then(() => { try { return screen.orientation.lock('landscape'); } catch (e) {} }).catch(() => flash(tr('Fullscreen is not available here')));
  }
  else if (name === 'reset') {
    if (!resetArm) { resetArm = true; clearTimeout(resetTimer); resetTimer = setTimeout(() => { resetArm = false; if (curScreen === 'settings') showScreen('settings'); }, 3000); }
    else { resetArm = false; save = defaults(); persist(); resize(); enterMenu(); flash(tr('Progress erased')); }
    showScreen('settings');
  }
}
scr.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) { audioInit(); act(b.dataset.act); } });

/* ================= boot with splash ================= */
const splash = document.getElementById('splash'), splashBar = document.getElementById('splashBar'), splashPct = document.getElementById('splashPct');
let splashOn = true, splashShown = performance.now(), splashPctV = 0, splashTarget = 0;
function splashStep(p) { splashTarget = Math.max(splashTarget, p); }
function splashTick() {
  if (!splashOn) return;
  const el = performance.now() - splashShown, minShow = 2300;
  const cap = Math.min(1, el / minShow);                 /* bar never outruns the minimum display time */
  splashPctV += (Math.min(splashTarget, cap) - splashPctV) * 0.18;
  const pc = Math.round(splashPctV * 100);
  splashBar.style.width = pc + '%'; splashPct.textContent = pc + '%';
  if (splashTarget >= 1 && el >= minShow && splashPctV > 0.985) { endSplash(); return; }
  requestAnimationFrame(splashTick);
}
function endSplash() {
  splashBar.style.width = '100%'; splashPct.textContent = '100%';
  splash.classList.add('out'); setTimeout(() => { splash.hidden = true; splashOn = false; }, 450);
  splashOn = false; splashOut = true;
}
let splashOut = false;
splashTick();

loadSave(); pickLang(); applyLang(); splashStep(0.25);
bindHold(document.getElementById('bL'), 'left'); bindHold(document.getElementById('bR'), 'right');
bindHold(document.getElementById('bBrake'), 'brake'); bindHold(document.getElementById('bTurbo'), 'turbo');
bindHold(document.getElementById('bGas'), 'gas');
document.getElementById('pauseBtn').addEventListener('click', togglePause);
splashStep(0.5);
resize(); enterMenu(); splashStep(0.75);
let lastT = 0;
const errSeen = new Set();
function showErr(where, e) {                 /* never let one bad frame freeze the game; show the reason instead */
  const m = where + ': ' + (e && e.message || e); if (errSeen.has(m)) return; errSeen.add(m);
  let d = document.getElementById('errBox');
  if (!d) { d = document.createElement('div'); d.id = 'errBox'; d.style.cssText = 'position:absolute;left:8px;right:8px;top:44px;z-index:60;background:rgba(160,0,30,.92);color:#fff;font:12px/1.35 monospace;padding:8px 10px;border-radius:8px;user-select:text;-webkit-user-select:text;pointer-events:auto;direction:ltr;text-align:left'; document.getElementById('app').appendChild(d); }
  d.textContent = (d.textContent ? d.textContent + '\n' : 'Error report, send this to Yahya:\n') + m + ((e && e.stack) ? ' @ ' + String(e.stack).split('\n')[1] : '');
  d.style.whiteSpace = 'pre-wrap';
}
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now; if (!(dt > 0)) dt = 0.016; dt = Math.min(0.05, dt); frameDt = dt;
  try { update(dt); } catch (e) { showErr('update', e); }
  try { render(); } catch (e) { showErr('render', e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const fontsReady = (document.fonts && document.fonts.ready) ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(() => { splashStep(1); });

/* Android back button: returns true when the game handled it */
window.__back = function () {
  if (splashOn) return true;
  if (state === 'play' || state === 'paused') { togglePause(); return true; }
  if (state === 'countdown' || state === 'finished') { enterMenu(); return true; }
  if (curScreen !== 'home' && !scr.hidden) { act('back'); return true; }
  return false;
};
